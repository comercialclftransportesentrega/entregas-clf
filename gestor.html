<title>Painel do Gestor — Comprovantes CLF</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#1b1f24;--muted:#66707c;--line:#e2e5ea;--pri:#0b5cad;--red:#c8102e;--ok:#1d7a3e;--warn:#9a6700;--gray:#8a929c}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{display:flex;align-items:center;gap:14px;background:#fff;padding:10px 18px;border-bottom:3px solid var(--red)}
  header .logo{height:52px}
  header h1{margin:0;font-size:18px}
  header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
  header .sair{margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--muted)}
  nav{display:flex;gap:4px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
  nav button{border:0;background:none;padding:13px 14px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
  nav button.ativo{color:var(--pri);border-bottom-color:var(--pri)}
  main{max-width:1200px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .filtros{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:12px}
  @media (max-width:760px){.filtros{grid-template-columns:1fr 1fr}.filtros .busca{grid-column:1/-1}}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
  input,select{width:100%;padding:10px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-family:inherit}
  .btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn.sec{background:#fff;color:var(--pri);border:1px solid var(--pri)}
  .btn.perigo{background:#fff;color:var(--red);border:1px solid var(--red)}
  .btn:disabled{opacity:.5;cursor:default}
  .resumo{color:var(--muted);font-size:13px;margin:0 2px 10px}
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}
  .item:hover{border-color:var(--pri)}
  .thumb{width:100%;aspect-ratio:4/3;background:#e9ecef center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:13px}
  .item .info{padding:10px 12px;font-size:13px;line-height:1.5}
  .item .q{font-weight:700;font-size:14px}
  .chip{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;margin-right:4px}
  .chip.frota{background:#e6effa;color:var(--pri)} .chip.terc{background:#fdecef;color:var(--red)}
  .chip.ok{background:#e3f4ea;color:var(--ok)} .chip.pend{background:#fff4d6;color:var(--warn)} .chip.enc{background:#eceef1;color:var(--gray)}
  .alerta{color:var(--warn);font-weight:600}
  .muted{color:var(--muted)}
  .vazio{text-align:center;color:var(--muted);padding:40px}
  .mais{display:block;margin:16px auto}
  /* login */
  .login{max-width:380px;margin:60px auto;text-align:center}
  .login .logo{height:80px;margin-bottom:10px}
  .login input{margin:10px 0}
  .lembrar{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);margin-bottom:12px}
  .lembrar input{width:auto;margin:0}
  .erro{color:var(--red);font-size:14px;margin-top:10px;min-height:20px}
  .okmsg{color:var(--ok);font-weight:600}
  /* modal */
  .fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal{background:#fff;border-radius:12px;max-width:900px;width:100%;max-height:94vh;overflow:auto;display:grid;grid-template-columns:3fr 2fr}
  @media (max-width:760px){.modal{grid-template-columns:1fr}}
  .modal .foto{background:#111;display:flex;align-items:center;justify-content:center;min-height:300px;color:#aaa}
  .modal .foto img{width:100%;height:auto;display:block}
  .modal .det{padding:16px;font-size:14px;line-height:1.7}
  .modal .det b{display:inline-block;min-width:110px;color:var(--muted);font-weight:600}
  .modal .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .modal .acoes a{text-decoration:none}
  /* manifestos */
  .mf{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
  .mf summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .mf summary::-webkit-details-marker{display:none}
  .mf .tit{font-weight:700}
  .barra{height:8px;background:#eceef1;border-radius:8px;overflow:hidden;margin-top:6px;max-width:320px}
  .barra i{display:block;height:100%;background:var(--ok)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;background:#fafbfc}
  .linkfoto{color:var(--pri);cursor:pointer;font-weight:600;background:none;border:0;padding:0;font:inherit}
  .mfacoes{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
  /* importar */
  .drop{border:2px dashed var(--pri);border-radius:12px;padding:30px;text-align:center;color:var(--pri);font-weight:700;cursor:pointer;background:#fff}
  .drop input{display:none}
  .hidden{display:none!important}
</style>
</head>

<script>
const URL_SERVIDOR = 'https://script.google.com/macros/s/AKfycbwnRk67T1YckzQ975sIdmVbZER4UOT2eRcFM0I9sa97R1RqzjF8aAAtY3nmGhV_5py8wQ/exec';
// Lê o texto do DAMDFE (PDF do bsoft) e devolve os dados do manifesto.
// paginas: [[{s, x, y}], ...]  (coordenadas com origem no canto superior esquerdo)
function lerDAMDFE(paginas) {
  const todos = [].concat(...paginas);
  const txt = i => i.s.trim();
  const res = { chave: "", numero: "", emissao: "", placas: [], condutores: [], ctes: [] };

  // Chave de acesso (44 dígitos) -> número do MDF-e
  for (const i of todos) {
    const d = txt(i).replace(/\D/g, "");
    if (d.length === 44 && /^\d{4}(\.\d{4}){10}$/.test(txt(i))) { res.chave = d; res.numero = String(Number(d.slice(25, 34))); break; }
  }
  // Data de emissão: data/hora mais próxima do rótulo
  const p1 = paginas[0] || [];
  const rotEm = p1.find(i => /Data e Hora de Emiss/i.test(i.s));
  const datas = p1.filter(i => /^\d{2}\/\d{2}\/\d{4} \d{2}:\d{2}(:\d{2})?$/.test(txt(i)));
  if (datas.length) {
    const ref = rotEm || datas[0];
    datas.sort((a, b) => Math.abs(a.x - ref.x) + Math.abs(a.y - ref.y) * 2 - (Math.abs(b.x - ref.x) + Math.abs(b.y - ref.y) * 2));
    res.emissao = txt(datas[0]);
  }
  // Placas
  for (const i of todos) {
    const m = /^([A-Z]{3})-?(\d[A-Z0-9]\d{2})(\/[A-Z]{2})?$/.exec(txt(i).toUpperCase());
    if (m) { const p = m[1] + m[2]; if (!res.placas.includes(p)) res.placas.push(p); }
  }
  // Condutores (CPF + nome na mesma linha, à direita de "Condutores")
  const rotCond = p1.find(i => /^Condutores$/i.test(txt(i)));
  if (rotCond) {
    const cpfs = p1.filter(i => /^\d{11}$/.test(txt(i)) && i.x >= rotCond.x - 15 && i.y > rotCond.y);
    for (const c of cpfs) {
      const nome = p1.filter(i => Math.abs(i.y - c.y) <= 3 && i.x > c.x + 20 && /[A-Za-z]/.test(i.s)).map(txt).join(" ");
      res.condutores.push({ cpf: c.s.trim(), nome });
    }
  }
  // CT-es
  for (const pag of paginas) {
    const hRem = pag.find(i => /^Remetente$/i.test(txt(i)));
    const hDest = pag.find(i => /^Destinat/i.test(txt(i)));
    const hDoc = pag.find(i => /^Doc\.?$/i.test(txt(i)));
    const hTipo = pag.find(i => /^Tipo$/i.test(txt(i)));
    const hQtd = pag.find(i => /^Quant/i.test(txt(i)));
    const hMerc = pag.find(i => /^Merc/i.test(txt(i)));
    const totais = pag.find(i => /^Totais$/i.test(txt(i)));
    const ctes = pag.filter(i => /^CT-?e\s*-\s*S[EÉ]RIE\s*\d+\s*-\s*\d+$/i.test(txt(i))).sort((a, b) => a.y - b.y);
    if (!ctes.length) continue;
    const xRem = ctes[0].x + 60;
    const xDest = hDest ? hDest.x - 90 : 320;
    const xDoc = hDoc ? hDoc.x - 30 : 545;
    const xTipo = hTipo ? hTipo.x - 15 : 630;
    const xQtd = hQtd ? hQtd.x - 5 : 698;
    const xMerc = hMerc ? hMerc.x - 5 : 730;
    const fimPag = totais ? totais.y - 2 : Infinity;

    ctes.forEach((c, k) => {
      const m = /S[EÉ]RIE\s*(\d+)\s*-\s*(\d+)/i.exec(c.s);
      const y0 = c.y - 6;
      const y1 = k + 1 < ctes.length ? ctes[k + 1].y - 6 : fimPag;
      const bloco = pag.filter(i => i.y >= y0 && i.y < y1 && i !== c);
      const col = (a, b) => bloco.filter(i => i.x >= a && i.x < b).sort((p, q) => p.y - q.y || p.x - q.x);
      const linhas = itens => {
        const out = [];
        for (const i of itens) {
          const ult = out[out.length - 1];
          if (ult && Math.abs(ult.y - i.y) <= 2) ult.t += " " + txt(i); else out.push({ y: i.y, t: txt(i) });
        }
        return out.map(l => l.t);
      };
      const rem = linhas(col(xRem, xDest));
      const dest = linhas(col(xDest, xDoc));
      const uf = (() => { const l = dest.length > 1 ? dest[dest.length - 1] : ""; const mm = /\s([A-Z]{2})$/.exec(l); return mm ? mm[1] : ""; })();
      res.ctes.push({
        serie: m[1], numero: m[2],
        remetente: rem[0] || "",
        destinatario: dest[0] || "",
        endereco: dest.slice(1).join(" ").replace(/\s+/g, " ").trim(),
        uf,
        nfs: col(xDoc, xTipo).map(txt).join(" "),
        volumes: col(xQtd, xMerc).map(txt).join(" ")
      });
    });
  }
  return res;
}



(() => {
  const $ = id => document.getElementById(id);
  const el = (tag, txt, cls) => { const e = document.createElement(tag); if (txt != null) e.textContent = txt; if (cls) e.className = cls; return e; };
  let SENHA = '';
  const guarda = {
    get(){ try { return localStorage.getItem('gestor_s') || sessionStorage.getItem('gestor_s') || ''; } catch { return ''; } },
    set(s, lembrar){ try { (lembrar ? localStorage : sessionStorage).setItem('gestor_s', s); } catch {} },
    limpar(){ try { localStorage.removeItem('gestor_s'); sessionStorage.removeItem('gestor_s'); } catch {} }
  };

  async function api(acao, extra){
    const r = await fetch(URL_SERVIDOR, { method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ acao, senha: SENHA }, extra || {})) });
    const j = await r.json();
    if (!j.ok){
      if (j.senha){ sair(); $('erroLogin').textContent = j.erro; }
      throw new Error(j.erro || 'Erro no servidor');
    }
    return j;
  }

  // ---------------- login ----------------
  async function entrar(s, lembrar){
    SENHA = s;
    $('entrar').disabled = true; $('erroLogin').textContent = '';
    try {
      await api('g_login');
      guarda.set(s, lembrar);
      $('telaLogin').classList.add('hidden'); $('telaApp').classList.remove('hidden');
      carregarEntregas();
    } catch (e) {
      SENHA = ''; $('erroLogin').textContent = e.message;
    }
    $('entrar').disabled = false;
  }
  function sair(){
    SENHA = ''; guarda.limpar();
    $('telaApp').classList.add('hidden'); $('telaLogin').classList.remove('hidden');
    $('senha').value = '';
  }
  $('formLogin').addEventListener('submit', e => { e.preventDefault(); entrar($('senha').value, $('lembrar').checked); });
  $('sair').onclick = sair;
  const salva = guarda.get(); if (salva) entrar(salva, true);

  // ---------------- abas ----------------
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('ativo', x === b));
    ['comp','manif','imp'].forEach(a => $('aba-' + a).classList.toggle('hidden', a !== b.dataset.aba));
    if (b.dataset.aba === 'manif' && !manifCarregado) carregarManifestos();
  });

  // ---------------- datas ----------------
  const diaISO = s => { const m = /(\d{2})\/(\d{2})\/(\d{4})/.exec(s || ''); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };

  // ---------------- comprovantes ----------------
  let entregas = [], filtradas = [], mostrando = 0;
  const POR_PAGINA = 48;
  const thumbCache = {};
  let filaThumbs = [], buscandoThumbs = false;

  async function carregarEntregas(){
    $('resumo').textContent = 'Carregando…'; $('grade').replaceChildren();
    try {
      const j = await api('g_entregas');
      entregas = j.itens;
      filtrar();
    } catch (e) { $('resumo').textContent = 'Erro: ' + e.message; }
  }
  function filtrar(){
    const q = $('fBusca').value.trim().toLowerCase(), de = $('fDe').value, ate = $('fAte').value, org = $('fOrigem').value;
    filtradas = entregas.filter(r => {
      const d = diaISO(r.quando);
      if (de && d < de) return false;
      if (ate && d > ate) return false;
      if (org && r.origem !== org) return false;
      if (!q) return true;
      return [r.nf, r.motorista, r.placa, r.cliente, r.cpf, r.obs].some(v => String(v || '').toLowerCase().includes(q));
    });
    mostrando = 0; $('grade').replaceChildren();
    $('resumo').textContent = `${filtradas.length} comprovante(s)` + (filtradas.length !== entregas.length ? ` de ${entregas.length}` : '');
    if (!filtradas.length) $('grade').append(el('div', 'Nenhum comprovante encontrado.', 'vazio'));
    mostrarMais();
  }
  function mostrarMais(){
    const lote = filtradas.slice(mostrando, mostrando + POR_PAGINA);
    mostrando += lote.length;
    for (const r of lote) $('grade').append(cartao(r));
    $('mais').classList.toggle('hidden', mostrando >= filtradas.length);
    pedirThumbs(lote.map(r => r.foto).filter(Boolean));
  }
  function cartao(r){
    const b = el('button', null, 'item');
    const t = el('div', r.foto ? 'carregando…' : 'sem foto', 'thumb'); t.dataset.foto = r.foto || '';
    if (thumbCache[r.foto]) { t.style.backgroundImage = `url(data:image/png;base64,${thumbCache[r.foto]})`; t.textContent = ''; }
    const i = el('div', null, 'info');
    i.append(el('div', r.quando, 'q'));
    const l1 = el('div'); l1.append(el('span', r.origem === 'Site terceiro' ? 'Terceiro' : 'Frota', 'chip ' + (r.origem === 'Site terceiro' ? 'terc' : 'frota')), document.createTextNode(r.nf || '-'));
    i.append(l1, el('div', [r.motorista, r.placa].filter(Boolean).join(' • ')), el('div', r.cliente || '', 'muted'));
    if (/qualidade baixa/i.test(r.obs || '')) i.append(el('div', '⚠ foto com qualidade baixa', 'alerta'));
    b.append(t, i);
    b.onclick = () => abrirFoto(r.foto, [
      ['Data/hora da foto', r.quando], ['Recebido em', r.recebido], ['Origem', r.origem], ['Motorista', r.motorista],
      ['CPF', r.cpf], ['Placa', r.placa], ['NF / CT-e', r.nf], ['Cliente', r.cliente], ['Observação', r.obs]
    ]);
    return b;
  }
  function pedirThumbs(ids){
    filaThumbs.push(...ids.filter(id => !(id in thumbCache)));
    if (!buscandoThumbs) proximoLoteThumbs();
  }
  async function proximoLoteThumbs(){
    const lote = [...new Set(filaThumbs.splice(0, 12))];
    if (!lote.length){ buscandoThumbs = false; return; }
    buscandoThumbs = true;
    try {
      const j = await api('g_thumbs', { ids: lote });
      Object.assign(thumbCache, j.thumbs);
      document.querySelectorAll('.thumb').forEach(t => {
        const id = t.dataset.foto;
        if (id && id in j.thumbs){
          if (j.thumbs[id]) { t.style.backgroundImage = `url(data:image/png;base64,${j.thumbs[id]})`; t.textContent = ''; }
          else t.textContent = 'clique para ver';
        }
      });
    } catch {}
    proximoLoteThumbs();
  }
  let tFiltro = null;
  ['fBusca','fDe','fAte','fOrigem'].forEach(id => $(id).addEventListener('input', () => { clearTimeout(tFiltro); tFiltro = setTimeout(filtrar, 250); }));
  $('mais').onclick = mostrarMais;
  $('recarregar').onclick = carregarEntregas;

  // ---------------- modal foto ----------------
  async function abrirFoto(id, detalhes){
    const det = $('mDet'); det.replaceChildren();
    detalhes.filter(([, v]) => v).forEach(([k, v]) => { const d = el('div'); d.append(el('b', k), document.createTextNode(' ' + v)); det.append(d); });
    $('mFoto').replaceChildren(document.createTextNode(id ? 'Carregando foto…' : 'Sem foto'));
    $('mBaixar').classList.add('hidden'); $('mDrive').classList.add('hidden');
    $('fundo').style.display = 'flex';
    if (!id) return;
    try {
      const j = await api('g_foto', { id });
      const src = 'data:image/jpeg;base64,' + j.foto.b64;
      const img = el('img'); img.src = src; img.alt = j.foto.nome;
      $('mFoto').replaceChildren(img);
      $('mBaixar').href = src; $('mBaixar').download = j.foto.nome; $('mBaixar').classList.remove('hidden');
      if (/^https:\/\//.test(j.foto.url)) { $('mDrive').href = j.foto.url; $('mDrive').classList.remove('hidden'); }
    } catch (e) { $('mFoto').textContent = 'Não foi possível carregar a foto: ' + e.message; }
  }
  $('mFechar').onclick = () => $('fundo').style.display = 'none';
  $('fundo').addEventListener('click', e => { if (e.target === $('fundo')) $('fundo').style.display = 'none'; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('fundo').style.display = 'none'; });

  // ---------------- manifestos ----------------
  let manifCarregado = false, manifestos = [];
  async function carregarManifestos(){
    $('mResumo').textContent = 'Carregando…'; $('listaMf').replaceChildren();
    try {
      const j = await api('g_manifestos');
      const grupos = new Map();
      j.itens.forEach(r => { if (!grupos.has(r.chave)) grupos.set(r.chave, []); grupos.get(r.chave).push(r); });
      manifestos = [...grupos.values()].map(ctes => {
        const c0 = ctes[0];
        const n = s => ctes.filter(c => String(c.status).toLowerCase() === s).length;
        return { chave: c0.chave, manifesto: c0.manifesto, emissao: c0.emissao, placas: c0.placas, motorista: c0.motorista,
                 ctes, entregues: n('entregue'), pendentes: n('pendente'), encerrados: ctes.length - n('entregue') - n('pendente') };
      }).sort((a, b) => (diaISO(b.emissao) + b.emissao.slice(11)).localeCompare(diaISO(a.emissao) + a.emissao.slice(11)));
      manifCarregado = true;
      filtrarManif();
    } catch (e) { $('mResumo').textContent = 'Erro: ' + e.message; }
  }
  function filtrarManif(){
    const q = $('mBusca').value.trim().toLowerCase(), sit = $('mSit').value;
    const lista = manifestos.filter(m => {
      if (sit === 'aberto' && !m.pendentes) return false;
      if (sit === 'fim' && m.pendentes) return false;
      if (!q) return true;
      return [m.manifesto, m.placas, m.motorista].some(v => String(v).toLowerCase().includes(q)) ||
             m.ctes.some(c => [c.numero, c.destinatario, c.nfs].some(v => String(v).toLowerCase().includes(q)));
    });
    $('mResumo').textContent = `${lista.length} manifesto(s)`;
    const box = $('listaMf'); box.replaceChildren();
    if (!lista.length) box.append(el('div', 'Nenhum manifesto encontrado.', 'vazio'));
    lista.forEach(m => box.append(blocoManif(m)));
  }
  function blocoManif(m){
    const d = el('details', null, 'mf');
    const s = el('summary');
    const esq = el('div');
    esq.append(el('div', `Manifesto ${m.manifesto} — ${m.emissao}`, 'tit'),
               el('div', `${m.placas} • ${m.motorista || 'sem condutor'}`, 'muted'));
    const barra = el('div', null, 'barra'); const fill = el('i'); fill.style.width = (100 * m.entregues / m.ctes.length) + '%'; barra.append(fill);
    esq.append(barra);
    const dir = el('div');
    dir.append(el('span', `${m.entregues}/${m.ctes.length} entregues`, 'chip ok'));
    if (m.pendentes) dir.append(el('span', `${m.pendentes} pendente(s)`, 'chip pend'));
    if (m.encerrados) dir.append(el('span', `${m.encerrados} encerrado(s)`, 'chip enc'));
    s.append(esq, dir); d.append(s);
    const t = el('table'); const h = el('tr');
    ['CT-e', 'Destinatário', 'Entrega', 'NF-e', 'Situação', 'Entregue em', 'Foto'].forEach(x => h.append(el('th', x)));
    t.append(h);
    m.ctes.forEach(c => {
      const r = el('tr');
      const st = String(c.status).toLowerCase();
      const chip = el('span', c.status, 'chip ' + (st === 'entregue' ? 'ok' : st === 'pendente' ? 'pend' : 'enc'));
      [c.serie + '-' + c.numero, c.destinatario, c.endereco, c.nfs].forEach(x => r.append(el('td', x)));
      const tdS = el('td'); tdS.append(chip); r.append(tdS);
      r.append(el('td', c.entregueEm + (c.entreguePor ? ' — ' + c.entreguePor : '')));
      const tdF = el('td');
      if (c.foto){ const b = el('button', 'Ver foto', 'linkfoto'); b.onclick = () => abrirFoto(c.foto, [['Manifesto', m.manifesto], ['CT-e', c.serie + '-' + c.numero], ['Destinatário', c.destinatario], ['NF-e', c.nfs], ['Entregue em', c.entregueEm], ['Entregue por', c.entreguePor]]); tdF.append(b); }
      r.append(tdF); t.append(r);
    });
    const wrap = el('div'); wrap.style.overflowX = 'auto'; wrap.append(t); d.append(wrap);
    if (m.pendentes){
      const ac = el('div', null, 'mfacoes');
      const info = el('span', '', 'muted');
      const b = el('button', `Encerrar ${m.pendentes} pendente(s)`, 'btn perigo');
      let armado = false;
      b.onclick = async () => {
        if (!armado){ armado = true; b.textContent = 'Clique de novo para confirmar'; info.textContent = 'Os pendentes deixam de aparecer para o motorista.'; setTimeout(() => { armado = false; b.textContent = `Encerrar ${m.pendentes} pendente(s)`; info.textContent = ''; }, 5000); return; }
        b.disabled = true; b.textContent = 'Encerrando…';
        try { const j = await api('g_encerrar', { chave: m.chave }); info.textContent = `${j.encerrados} CT-e(s) encerrado(s).`; carregarManifestos(); }
        catch (e) { info.textContent = 'Erro: ' + e.message; b.disabled = false; }
      };
      ac.append(info, b); d.append(ac);
    }
    return d;
  }
  $('mBusca').addEventListener('input', () => { clearTimeout(tFiltro); tFiltro = setTimeout(filtrarManif, 250); });
  $('mSit').addEventListener('change', filtrarManif);
  $('mRecarregar').onclick = carregarManifestos;

  // ---------------- importar MDF-e ----------------
  const pdfjsLib = window['pdfjs-dist/build/pdf'];
  if (pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  let lidos = [];
  async function lerPDF(file){
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const paginas = [];
    for (let p = 1; p <= doc.numPages; p++){
      const page = await doc.getPage(p); const vp = page.getViewport({ scale: 1 });
      const tc = await page.getTextContent();
      paginas.push(tc.items.filter(i => i.str.trim()).map(i => { const t = pdfjsLib.Util.transform(vp.transform, i.transform); return { s: i.str, x: t[4], y: t[5] }; }));
    }
    return lerDAMDFE(paginas);
  }
  $('arqPdf').addEventListener('change', async e => {
    const files = [...e.target.files]; e.target.value = '';
    const prev = $('previa'); prev.replaceChildren(); lidos = []; $('impStatus').replaceChildren();
    if (!pdfjsLib){ prev.append(el('div', 'Não foi possível carregar o leitor de PDF. Verifique a internet e recarregue a página.', 'erro')); return; }
    for (const f of files){
      const box = el('div', null, 'card'); box.style.marginTop = '12px';
      try {
        const m = await lerPDF(f);
        if (!m.chave || !m.ctes.length) throw new Error('não encontrei CT-es neste PDF');
        lidos.push(m);
        box.append(el('div', `Manifesto ${m.numero} — ${m.emissao}`, 'tit'));
        box.append(el('div', `Placas: ${m.placas.join(' / ')} • Motorista: ${m.condutores.map(c => c.nome).join(' / ') || '-'} • ${m.ctes.length} CT-e(s)`, 'muted'));
        const t = el('table'); const h = el('tr'); ['CT-e', 'Destinatário', 'Entrega', 'NF-e', 'Vol.'].forEach(x => h.append(el('th', x))); t.append(h);
        m.ctes.forEach(c => { const r = el('tr'); [c.serie + '-' + c.numero, c.destinatario, c.endereco, c.nfs, c.volumes].forEach(x => r.append(el('td', x))); t.append(r); });
        box.append(t);
      } catch (err) { box.append(el('div', f.name + ': ' + (err.message || err), 'erro')); }
      prev.append(box);
    }
    $('btnImportar').disabled = !lidos.length;
  });
  $('btnImportar').onclick = async () => {
    $('btnImportar').disabled = true;
    const st = $('impStatus'); st.replaceChildren(el('div', 'Importando…'));
    const msgs = [];
    for (const m of lidos){
      try {
        const r = await api('g_importar', { manifesto: m });
        msgs.push(el('div', `✅ Manifesto ${m.numero}: ${r.novos} CT-e(s) importado(s)` + (r.jaExistiam ? `, ${r.jaExistiam} já estavam na planilha` : '') + (r.encerrados ? `. ${r.encerrados} pendente(s) de viagens anteriores desta placa foram encerrados.` : ''), 'okmsg'));
      } catch (e) { msgs.push(el('div', `Manifesto ${m.numero}: ${e.message}`, 'erro')); }
    }
    st.replaceChildren(...msgs);
    lidos = []; manifCarregado = false;
  };
})();
</script>
</body>
</html>
