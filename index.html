<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1b1f24; --muted:#66707c; --line:#e2e5ea;
    --pri:#0b5cad; --pri-ink:#fff; --ok:#1d7a3e; --err:#b3261e; --warn:#9a6700;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121417; --card:#1c1f24; --ink:#eef0f3; --muted:#9aa3ad; --line:#2c3138; --pri:#4b9bef; --pri-ink:#0b1320; --ok:#5cc282; --err:#f2857c; --warn:#e3b341; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
  header{display:flex;align-items:center;gap:12px;background:#fff;color:#1b1f24;padding:10px 14px;border-bottom:3px solid #c8102e}
  header .logo{height:56px;width:auto;flex:none}
  header h1{margin:0;font-size:17px;color:#1b1f24}
  header p{margin:2px 0 0;font-size:13px;color:#66707c}
  main{max-width:640px;margin:0 auto;padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}
  input,textarea{width:100%;padding:13px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit}
  textarea{min-height:60px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:block;width:100%;padding:16px;border:0;border-radius:10px;font-size:17px;font-weight:700;background:var(--pri);color:var(--pri-ink)}
  .btn:disabled{opacity:.45}
  .btn.sec{background:transparent;color:var(--pri);border:2px solid var(--pri);padding:11px;font-size:15px}
  .photo-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:24px;border:2px dashed var(--pri);border-radius:12px;color:var(--pri);font-weight:700;font-size:18px;margin-top:14px}
  .photo-btn input{display:none}
  #preview{display:none;margin-top:12px}
  #preview img{width:100%;border-radius:10px;border:1px solid var(--line)}
  .msg{padding:12px;border-radius:10px;margin-top:12px;font-size:15px;display:none}
  .msg.ok{display:block;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
  .msg.err{display:block;background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
  .msg.warn{display:block;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .msg.info{display:block;background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
  .pend{display:none;background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
  .pend b{display:block;margin-bottom:8px}
  h2{font-size:15px;margin:0 0 8px}
  .hist{list-style:none;margin:0;padding:0;font-size:14px}
  .hist li{padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
  .hist li:first-child{border-top:0}
  .muted{color:var(--muted)}
  .st-ok{color:var(--ok);font-weight:600;white-space:nowrap}
  .st-pend{color:var(--warn);font-weight:600;white-space:nowrap}
  .lista{list-style:none;margin:0 0 10px;padding:0}
  .lista li{margin-top:8px}
  .lista button{width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}
  .lista button:active{border-color:var(--pri)}
  .lista .t{font-weight:700;font-size:16px}
  .lista .d{font-size:14px;margin-top:2px}
  .lista .e{font-size:13px;color:var(--muted);margin-top:2px}
  .lista .go{float:right;color:var(--pri);font-weight:700;font-size:14px}
  .cond{display:none;background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:10px;padding:10px 12px;margin-bottom:4px;font-size:14px}
  .cond button{margin:8px 8px 0 0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
  .sel{display:none;background:color-mix(in srgb,var(--pri) 12%,transparent);border:1px solid var(--pri);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
  .sel b{display:block;font-size:16px}
  .sel button{margin-top:8px;background:transparent;border:0;color:var(--pri);font-weight:700;padding:0;font-size:14px}
</style>
</head>

  <div><h1>Comprovantes de Entrega</h1><p id="empresa"></p></div>
</header>
<main>
  <div class="pend" id="pend">
    <b id="pendTxt"></b>
    <button class="btn sec" id="retry">Tentar enviar agora</button>
  </div>

  <div class="card" id="pendCard" style="display:none">
    <h2>🚚 Entregas da viagem <span id="pendPlaca" class="muted"></span></h2>
    <p class="muted" id="pendInfo" style="font-size:13px;margin:0"></p>
    <ul class="lista" id="lista"></ul>
    <button type="button" class="btn sec" id="atualizar">Atualizar lista</button>
  </div>

  <form class="card" id="form" autocomplete="off">
    <div class="cond" id="condBox"></div>
    <label for="motorista">Nome completo *</label>
    <input id="motorista" required autocomplete="name" placeholder="Seu nome completo">
    <div class="row">
      <div>
        <label for="cpf">CPF *</label>
        <input id="cpf" required inputmode="numeric" maxlength="14" placeholder="000.000.000-00">
      </div>
      <div>
        <label for="placa">Placa do veículo *</label>
        <input id="placa" required maxlength="8" placeholder="ABC1D23" style="text-transform:uppercase">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="nf">Nº NF / CT-e *</label>
        <input id="nf" required inputmode="numeric" placeholder="Ex: 12345">
      </div>
      <div>
        <label for="cliente">Cliente</label>
        <input id="cliente" placeholder="Destinatário">
      </div>
    </div>
    <label for="obs">Observação</label>
    <textarea id="obs" placeholder="Ex: recebido por João, avaria na caixa…"></textarea>

    <div class="sel" id="sel"><span id="selTxt"></span><button type="button" id="selLimpar">✕ Não é esta entrega (preencher manualmente)</button></div>

    <label class="photo-btn">
      <input type="file" id="foto" accept="image/*" capture="environment">
      📷 <span id="photoLabel">Tirar foto do comprovante</span>
    </label>

    <div id="preview">
      <img id="previewImg" alt="Prévia do comprovante">
      <p class="muted" style="font-size:13px;margin:6px 2px 0">Data e hora já gravadas na foto. Não ficou boa? Toque acima para tirar outra.</p>
    </div>

    <div style="margin-top:16px">
      <button type="submit" class="btn" id="enviarBtn" disabled>Enviar comprovante</button>
    </div>
    <div class="msg" id="msg"></div>
  </form>

  <div class="card">
    <h2>Seus últimos envios neste celular</h2>
    <ul class="hist" id="hist"></ul>
    <p class="muted" id="histVazio" style="font-size:14px;margin:0">Nenhum envio ainda.</p>
  </div>
</main>

<script>
(() => {
  const C = window.CONFIG || {};
  const $ = id => document.getElementById(id);
  $("empresa").textContent = "Motoristas terceiros";

  const pad = n => String(n).padStart(2, "0");
  const fmt = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const novoId = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  const ls = {
    get(k, def){ try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch { return def; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  function showMsg(t, k){ const m = $("msg"); m.textContent = t; m.className = "msg " + k; }
  function clearMsg(){ $("msg").className = "msg"; }

  $("motorista").value = ls.get("motorista", "");
  $("placa").value = ls.get("placa", "");
  $("cpf").value = ls.get("cpf", "");

  // máscara e validação de CPF
  const soDig = v => String(v || "").replace(/\D/g, "");
  function mascaraCPF(v){
    const d = soDig(v).slice(0, 11);
    return d.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})\.(\d{3})(\d)/, "$1.$2.$3").replace(/(\d{3})\.(\d{3})\.(\d{3})(\d{1,2})$/, "$1.$2.$3-$4");
  }
  function cpfValido(v){
    const d = soDig(v);
    if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
    for (let t = 9; t < 11; t++){
      let s = 0;
      for (let i = 0; i < t; i++) s += Number(d[i]) * (t + 1 - i);
      if (((s * 10) % 11) % 10 !== Number(d[t])) return false;
    }
    return true;
  }
  const cpfOculto = v => { const d = soDig(v); return d.length === 11 ? `***.${d.slice(3,6)}.${d.slice(6,9)}-**` : "-"; };
  $("cpf").addEventListener("input", e => { e.target.value = mascaraCPF(e.target.value); });

  const configurado = C.URL_SCRIPT && /^https:\/\/script\.google(usercontent)?\.com\//.test(C.URL_SCRIPT);
  if (!configurado) showMsg("Aplicativo ainda não configurado: falta o endereço do servidor no arquivo config.js.", "err");

  // ---------------- fila offline (IndexedDB) ----------------
  let dbp = null;
  function idb(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open("comprovantes", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("fila", { keyPath: "id" });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function filaOp(mode, fn){
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction("fila", mode);
      const req = fn(tx.objectStore("fila"));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
    });
  }
  const filaAdd = item => filaOp("readwrite", s => s.put(item));
  const filaDel = id => filaOp("readwrite", s => s.delete(id));
  const filaAll = () => filaOp("readonly", s => s.getAll());

  // ---------------- histórico ----------------
  function histUpsert(item){
    const h = ls.get("hist", []).filter(x => x.id !== item.id);
    h.unshift(item);
    ls.set("hist", h.slice(0, 30));
    renderHist();
  }
  function renderHist(){

  // ---------------- foto + carimbo ----------------
  async function carregar(file){

    catch {

  // ---------------- qualidade da foto ----------------
// Analisa a qualidade da foto (nitidez, brilho, contraste) — roda no celular, antes do envio
function analisarQualidade(img){
  const LADO = 800;
  const s = Math.min(1, LADO / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(img, 0, 0, w, h);
  const px = g.getImageData(0, 0, w, h).data;
  const cinza = new Float32Array(w * h);
  let soma = 0, soma2 = 0, claros = 0, escuros = 0;
  for (let i = 0, j = 0; i < px.length; i += 4, j++){
    const v = 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2];
    cinza[j] = v; soma += v; soma2 += v * v;
    if (v > 250) claros++; else if (v < 20) escuros++;
  }
  const n = w * h, media = soma / n, desvio = Math.sqrt(Math.max(0, soma2 / n - media * media));
  // nitidez: variância do Laplaciano por bloco; usa os blocos mais nítidos (onde tem texto)
  const G = 8, bw = Math.floor(w / G), bh = Math.floor(h / G), notas = [];
  for (let by = 0; by < G; by++) for (let bx = 0; bx < G; bx++){
    // 2ª derivada na horizontal e na vertical: foto tremida perde nitidez numa das direções
    let hx1 = 0, hx2 = 0, vy1 = 0, vy2 = 0, k = 0;
    const x0 = Math.max(1, bx * bw), x1 = Math.min(w - 1, (bx + 1) * bw), y0 = Math.max(1, by * bh), y1 = Math.min(h - 1, (by + 1) * bh);
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++){
      const p = y * w + x;
      const dx = cinza[p - 1] + cinza[p + 1] - 2 * cinza[p];
      const dy = cinza[p - w] + cinza[p + w] - 2 * cinza[p];
      hx1 += dx; hx2 += dx * dx; vy1 += dy; vy2 += dy * dy; k++;
    }
    if (k) notas.push(Math.min(hx2 / k - (hx1 / k) ** 2, vy2 / k - (vy1 / k) ** 2));
  }
  notas.sort((a, b) => b - a);
  const nitidez = notas[Math.floor(notas.length * 0.1)] || 0;   // 90º percentil
  return { nitidez: Math.round(nitidez), brilho: Math.round(media), contraste: Math.round(desvio),
           estourado: claros / n, escuro: escuros / n };
}


  // limites calibrados: abaixo de BLOQUEIO a foto é recusada; entre BLOQUEIO e ALERTA pede confirmação
  const NITIDEZ_BLOQUEIO = 150, NITIDEZ_ALERTA = 350;
  function avaliar(q){
    if (q.brilho < 55 || q.escuro > 0.6) return { nivel: "bloqueio", motivo: "A foto ficou muito escura. Procure um lugar com mais luz ou acenda a lanterna do celular." };
    if (q.brilho > 235 && q.contraste < 50) return { nivel: "bloqueio", motivo: "A foto ficou estourada de luz (branca demais). Evite reflexo e luz direta no papel." };
    if (q.contraste < 18) return { nivel: "bloqueio", motivo: "Não dá para ver o comprovante na foto. Enquadre o papel e tire de novo." };
    if (q.nitidez < NITIDEZ_BLOQUEIO) return { nivel: "bloqueio", motivo: "A foto ficou tremida ou borrada e não dá para ler. Apoie o celular, espere focar e tire de novo." };
    if (q.nitidez < NITIDEZ_ALERTA) return { nivel: "alerta", motivo: "A foto pode estar um pouco tremida. Confira se dá para ler o comprovante. Se não der, tire outra." };
    if (q.brilho < 80) return { nivel: "alerta", motivo: "A foto está escura. Confira se dá para ler o comprovante. Se não der, tire outra." };
    return { nivel: "ok" };
  }

  async function carimbar(file, quando, dados){
    const img = await carregar(file);
    const qualidade = analisarQualidade(img);
    const max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
    const w = Math.round(img.width * s), h = Math.round(img.height * s);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d");
    g.drawImage(img, 0, 0, w, h);

    const fs = Math.max(16, Math.round(w * 0.034)), p = Math.round(fs * 0.6);
    const linhas = [
      { t: "📅 " + fmt(quando), bold: true, size: fs * 1.25 },
      { t: `Motorista: ${dados.motorista || "-"}   CPF: ${cpfOculto(dados.cpf)}`, size: fs },
      { t: `Placa: ${dados.placa || "-"}   NF/CT-e: ${dados.nf || "-"}` + (dados.cliente ? `   Cliente: ${dados.cliente}` : ""), size: fs },
      { t: (C.EMPRESA || "") + " • Comprovante de entrega • Terceiro", size: fs * 0.8 }
    ];
    const faixa = linhas.reduce((a, l) => a + l.size * 1.3, 0) + p * 2;
    g.fillStyle = "rgba(0,0,0,0.62)"; g.fillRect(0, h - faixa, w, faixa);
    g.textBaseline = "top";
    let y = h - faixa + p;
    for (const l of linhas){
      g.font = `${l.bold ? 700 : 500} ${Math.round(l.size)}px sans-serif`;
      g.fillStyle = l.bold ? "#ffd84d" : "#ffffff";
      let t = l.t;
      if (g.measureText(t).width > w - p * 2){
        while (t.length > 4 && g.measureText(t + "…").width > w - p * 2) t = t.slice(0, -1);
        t += "…";
      }
      g.fillText(t, p, y); y += l.size * 1.3;
    }
    g.font = `700 ${fs}px sans-serif`;
    const tt = fmt(quando), tw = g.measureText(tt).width;
    g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(w - tw - p * 3, p, tw + p * 2, fs * 1.5);
    g.fillStyle = "#ffd84d"; g.fillText(tt, w - tw - p * 2, p + fs * 0.25);

    return { dataUrl: c.toDataURL("image/jpeg", 0.82), qualidade };
  }

  let atual = null; // { dataUrl, quando }
  function dadosForm(){
    return {
      motorista: $("motorista").value.trim(),
      placa: $("placa").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ""),
      cpf: mascaraCPF($("cpf").value),
      nf: $("nf").value.trim(),
      cliente: $("cliente").value.trim(),
      obs: $("obs").value.trim()
    };
  }

  $("foto").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    clearMsg();
    const d = dadosForm();
    if (!d.motorista || !d.placa || !d.nf){
      showMsg("Preencha nome, CPF, placa e nº da NF antes de tirar a foto, para que saiam gravados na imagem.", "err");
      return;
    }
    if (!cpfValido(d.cpf)){
      showMsg("CPF inválido. Confira os números e tente de novo.", "err");
      $("cpf").focus();
      return;
    }
    showMsg("Processando foto…", "info");
    try {

      const r = await carimbar(file, quando, d);

      $("previewImg").src = r.dataUrl;

        $("enviarBtn").textContent = "Enviar comprovante";
        showMsg("❌ " + av.motivo, "err");

      }
      atual = { dataUrl: r.dataUrl, quando, dados: d, alerta: av.nivel === "alerta" };
      $("enviarBtn").disabled = false;
      if (av.nivel === "alerta"){
        $("enviarBtn").textContent = "Está legível — enviar assim mesmo";
        showMsg("⚠️ " + av.motivo, "warn");
      } else {
        $("enviarBtn").textContent = "Enviar comprovante";
        clearMsg();
      }
    } catch {
      showMsg("Não foi possível ler a foto. Tente novamente.", "err");
    }
  });

  // ---------------- envio ----------------
  async function enviarItem(item){
    const corpo = {
      token: C.TOKEN, id: item.id,
      motorista: item.motorista, placa: item.placa, cpf: item.cpf, origem: "Site terceiro", nf: item.nf, cliente: item.cliente, obs: item.obs,
      fotoEmMs: item.fotoEmMs,
      chaveMdfe: item.chaveMdfe || "", serieCte: item.serieCte || "", numeroCte: item.numeroCte || "", nfs: item.nfs || "",
      imagem: item.dataUrl.split(",")[1]
    };
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 90000);
    try {
      const r = await fetch(C.URL_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(corpo),
        redirect: "follow",
        signal: ctrl.signal
      });
      const j = await r.json();
      if (!j.ok) throw Object.assign(new Error(j.erro || "Erro no servidor"), { servidor: true });
      return true;
    } finally { clearTimeout(timer); }
  }

  let enviando = false;
  async function processarFila(){
    if (enviando || !configurado) return;
    enviando = true;
    let ultimoErro = null;
    try {
      const itens = (await filaAll()).sort((a, b) => a.fotoEmMs - b.fotoEmMs);
      for (const it of itens){
        try {
          await enviarItem(it);
          await filaDel(it.id);
          histUpsert({ id: it.id, nf: it.nf, fotoEmMs: it.fotoEmMs, ok: true });
        } catch (err) {
          ultimoErro = err;
          if (!err.servidor) break; // sem internet: para e tenta depois
        }
      }
    } catch {}
    enviando = false;
    await atualizarPendentes(ultimoErro);
  }

  async function atualizarPendentes(erro){
    let n = 0;
    try { n = (await filaAll()).length; } catch {}
    $("pend").style.display = n ? "block" : "none";
    if (n){
      let t = n === 1 ? "1 comprovante aguardando envio." : `${n} comprovantes aguardando envio.`;
      if (erro && erro.servidor) t += " Erro do servidor: " + erro.message;
      else t += " Será enviado automaticamente quando tiver internet.";
      $("pendTxt").textContent = t;
    }
    return n;
  }

  $("retry").onclick = () => processarFila();
  window.addEventListener("online", () => processarFila());
  document.addEventListener("visibilitychange", () => { if (!document.hidden) processarFila(); });
  setInterval(processarFila, 60000);

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    if (!atual) return;
    const d = atual.dados;
    const item = { id: novoId(), ...d, fotoEmMs: atual.quando.getTime(), dataUrl: atual.dataUrl };
    if (atual.alerta) item.obs = ((item.obs ? item.obs + " | " : "") + "⚠ foto com qualidade baixa (motorista confirmou que está legível)");
    if (selecionado && d.nf === selecionado.numero){
      Object.assign(item, { chaveMdfe: selecionado.chave, serieCte: selecionado.serie, numeroCte: selecionado.numero, nfs: selecionado.nfs });
    }
    const entregue = item.numeroCte ? selecionado : null;
    const btn = $("enviarBtn");
    btn.disabled = true; btn.textContent = "Enviando…";
    try {
      await filaAdd(item);
    } catch {
      showMsg("Pouco espaço no celular para guardar a foto. Libere espaço e tente de novo.", "err");
      btn.disabled = false; btn.textContent = "Enviar comprovante";
      return;
    }
    ls.set("motorista", d.motorista); ls.set("placa", d.placa); ls.set("cpf", d.cpf);
    histUpsert({ id: item.id, nf: item.nf, fotoEmMs: item.fotoEmMs, ok: false });

    // limpa para a próxima entrega
    if (entregue){ marcarFeito(entregue); renderLista(ultimaLista); }
    limparSelecao();
    atual = null;
    $("nf").value = ""; $("cliente").value = ""; $("obs").value = "";
    $("preview").style.display = "none";
    $("photoLabel").textContent = "Tirar foto do comprovante";
    showMsg("Enviando…", "info");

    await processarFila();
    const pendente = (await filaAll()).some(x => x.id === item.id);
    if (pendente) showMsg(`Comprovante ${item.numeroCte ? "do CT-e " + item.numeroCte : "da NF " + item.nf} salvo no celular. Será enviado quando houver internet.`, "info");
    else showMsg(`✅ Comprovante ${item.numeroCte ? "do CT-e " + item.numeroCte : "da NF " + item.nf} enviado — ${fmt(new Date(item.fotoEmMs))}`, "ok");
    btn.textContent = "Enviar comprovante";
  });

  // ---------------- lista de entregas da viagem ----------------
  let selecionado = null;
  const normPlaca = v => String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const chaveItem = it => it.chave + "|" + it.serie + "-" + it.numero;
  let ultimaLista = [];

  function marcarFeito(it){
    const f = ls.get("feitos", []);
    f.push(chaveItem(it));
    ls.set("feitos", f.slice(-300));
  }

  // ---------- nome/CPF do condutor vindos do manifesto ----------
  const temCpf = !!document.getElementById("cpf");
  const fmtCpf = v => { const d = String(v || "").replace(/\D/g, ""); return d.length === 11 ? `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}` : v || ""; };
  function aplicarCond(c, forcar){
    const auto = ls.get("autoCond", null);
    const nomeAtual = $("motorista").value.trim();
    const podeNome = forcar || !nomeAtual || (auto && nomeAtual === auto.nome);
    if (!podeNome) return false;
    $("motorista").value = c.nome;
    if (temCpf){
      const cpfAtual = $("cpf").value.trim();
      if (forcar || !cpfAtual || (auto && cpfAtual === auto.cpf)) $("cpf").value = fmtCpf(c.cpf);
    }
    ls.set("autoCond", { nome: c.nome, cpf: fmtCpf(c.cpf) });
    ls.set("motorista", $("motorista").value);
    if (temCpf) ls.set("cpf", $("cpf").value);
    return true;
  }
  function preencherCondutor(itens){
    const box = $("condBox");
    const mapa = new Map();
    (itens || []).forEach(it => {
      const nomes = String(it.motorista || "").split("/").map(x => x.trim());
      const cpfs = String(it.cpfMotorista || "").split("/").map(x => x.trim());
      nomes.forEach((n, i) => { if (n) mapa.set(cpfs[i] || n, { nome: n, cpf: cpfs[i] || "" }); });
    });
    const conds = [...mapa.values()];
    box.replaceChildren(); box.style.display = "none";
    if (!conds.length) return;
    if (conds.length === 1){
      aplicarCond(conds[0]);
      if ($("motorista").value.trim().toUpperCase() === conds[0].nome.toUpperCase()){
        box.textContent = temCpf ? "✓ Nome e CPF preenchidos pelo manifesto." : "✓ Nome preenchido pelo manifesto.";
        box.style.display = "block";
        return;
      }
    }
    // vários condutores, ou o nome digitado é diferente do manifesto: deixa escolher
    box.append(document.createTextNode(conds.length > 1 ? "Quem está dirigindo? (condutores do manifesto)" : "O manifesto desta placa está em nome de:"));
    box.append(document.createElement("br"));
    conds.forEach(c => {
      const b = document.createElement("button"); b.type = "button";
      b.textContent = c.nome + (temCpf && c.cpf ? " — " + fmtCpf(c.cpf) : "");
      b.onclick = () => { aplicarCond(c, true); box.replaceChildren(document.createTextNode("✓ Dados do condutor preenchidos pelo manifesto.")); };
      box.append(b);
    });
    box.style.display = "block";
  }

  function renderLista(itens, aviso){
    preencherCondutor(itens);
    const feitos = new Set(ls.get("feitos", []));
    const pend = (itens || []).filter(it => !feitos.has(chaveItem(it)));
    ultimaLista = itens || [];
    const ul = $("lista"); ul.replaceChildren();

      ? `${pend.length} entrega(s) pendente(s). Toque na entrega que você está fazendo.`

  let carregando = false;
  async function carregarLista(){
    const placa = normPlaca($("placa").value);
    if (placa.length < 7 || !configurado){ $("pendCard").style.display = "none"; return; }
    $("pendCard").style.display = "block";
    $("pendPlaca").textContent = "— " + placa;
    const cache = ls.get("lista_" + placa, null);
    if (cache) renderLista(cache);
    else $("pendInfo").textContent = "Carregando…";
    if (carregando) return;
    carregando = true;
    try {
      const url = C.URL_SCRIPT + "?acao=pendentes&placa=" + encodeURIComponent(placa) + "&token=" + encodeURIComponent(C.TOKEN);
      const r = await fetch(url, { redirect: "follow" });
      const j = await r.json();
      if (!j.ok) throw new Error(j.erro || "erro");
      // remove marcas locais de CT-es que o servidor já não lista (já baixados)
      const noServidor = new Set(j.itens.map(chaveItem));
      const naFila = new Set((await filaAll().catch(() => [])).filter(x => x.chaveMdfe).map(x => x.chaveMdfe + "|" + x.serieCte + "-" + x.numeroCte));
      ls.set("feitos", ls.get("feitos", []).filter(k => noServidor.has(k) || naFila.has(k)));
      ls.set("lista_" + placa, j.itens);
      renderLista(j.itens);
    } catch {
      renderLista(cache || [], cache ? "Sem internet: mostrando a última lista salva." : "Sem internet para carregar a lista. Você pode preencher a entrega manualmente abaixo.");
    }
    carregando = false;
  }
  $("atualizar").onclick = carregarLista;
  let tPlaca = null;
  $("placa").addEventListener("input", () => { clearTimeout(tPlaca); tPlaca = setTimeout(carregarLista, 700); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) carregarLista(); });
  window.addEventListener("online", carregarLista);
  carregarLista();

  renderHist();
  atualizarPendentes().then(n => { if (n) processarFila(); });
})();
</script>
</body>
</html>
